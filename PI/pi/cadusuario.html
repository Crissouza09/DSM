<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastrar Usuário - PathX</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body {
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url(./imagens/Telacadastrouser.png);
        background-size: cover;
        background-position: center;
        background-color: #1a0832;
        position: relative;
      }
      .back-btn {
        position: absolute;
        top: 30px;
        left: 30px;
        width: 45px;
        height: 45px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: white;
        transition: 0.3s;
      }
      .back-btn:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 30px;
        padding: 50px 40px;
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
      }
      .logo-container {
        width: 60px;
        height: 60px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      h1 {
        color: #ffffff;
        font-size: 2.2rem;
        font-weight: 300;
        margin-bottom: 30px;
        letter-spacing: 1px;
        text-align: center;
      }
      .input-group {
        position: relative;
        width: 100%;
        margin-bottom: 20px;
      }
      .input-group input {
        width: 100%;
        height: 50px;
        border-radius: 25px;
        border: none;
        outline: none;
        padding-left: 65px;
        font-size: 0.95rem;
        color: #333;
      }
      .icon-circle {
        position: absolute;
        left: 0;
        top: 0;
        width: 50px;
        height: 50px;
        background-color: rgba(85, 45, 146, 0.85);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(255, 255, 255, 0.7);
      }
      .btn-action {
        padding: 12px 50px;
        border-radius: 25px;
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.6);
        font-size: 1.1rem;
        font-weight: 300;
        cursor: pointer;
        transition: 0.3s;
        margin-top: 10px;
      }
      .btn-action:hover {
        background-color: rgba(255, 255, 255, 0.15);
        color: white;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="back-btn">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 12H5"></path>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </a>

    <div class="glass-card">
      <div class="logo-container">
        <svg
          width="30"
          height="30"
          viewBox="0 0 50 50"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M10 10 C 25 30, 25 30, 40 50"
            stroke="rgba(255,255,255,0.8)"
            stroke-width="2.5"
            stroke-linecap="round"
          />
          <path
            d="M40 10 C 25 30, 25 30, 10 50"
            stroke="rgba(255,255,255,0.8)"
            stroke-width="2.5"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <h1>Cadastrar</h1>

      <div class="input-group">
        <div class="icon-circle">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="7" r="4"></circle>
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          </svg>
        </div>
        <input type="email" placeholder="Email" />
      </div>

      <div class="input-group">
        <div class="icon-circle">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <input type="password" placeholder="Senha" />
      </div>

      <div class="input-group">
        <div class="icon-circle">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <input type="password" placeholder="Confirmar Senha" />
      </div>

      <a href="login.html">
      <button class="btn-action">Cadastrar</button>
      </a>
    </div>
  </body>
</html>
