<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - PathX</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; 
            background-image: url('imagens/fundologin.jpg'); background-size: cover; 
            background-position: center; background-color: #1a0832; position: relative;
        }

        .back-btn { 
            position: absolute; top: 30px; left: 30px; width: 45px; height: 45px; border-radius: 50%; 
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.05); 
            display: flex; align-items: center; justify-content: center; cursor: pointer; color: white;
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; 
            padding: 50px; width: 100%; max-width: 600px; display: flex; 
            gap: 40px; align-items: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .avatar-section { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .avatar-placeholder { 
            width: 150px; height: 150px; border-radius: 50%; background: rgba(255,255,255,0.1); 
            display: flex; align-items: center; justify-content: center; color: #b179eb;
        }

        .info-section { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .input-block { display: flex; flex-direction: column; }
        .label { color: rgba(255,255,255,0.6); font-size: 0.8rem; margin-bottom: 5px; }
        .value { color: white; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; }

        .btn-logout { 
            margin-top: 10px; padding: 12px; border-radius: 25px; border: none;
            background: linear-gradient(90deg, #8b4dc1, #5d2b8e); color: white;
            cursor: pointer; font-weight: 500; display: flex; align-items: center; 
            justify-content: center; gap: 10px; transition: 0.3s;
        }
        .btn-logout:hover { filter: brightness(1.2); }
    </style>
</head>
<body>

    <a href="vagas.html" class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"></path><polyline points="12 19 5 12 12 5"></polyline></svg>
    </a>

    <div class="glass-card">
        <div class="avatar-section">
            <div class="avatar-placeholder">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
        </div>

        <div class="info-section">
            <div class="input-block">
                <span class="label">Nome</span>
                <div class="value">Kaua Massaki</div>
            </div>
            <div class="input-block">
                <span class="label">Email</span>
                <div class="value">kauamassaki@gmail.com</div>
            </div>
            <div class="input-block">
                <span class="label">Telefone</span>
                <div class="value">(19) 99182-1122</div>
            </div>
            <div class="input-block">
                <span class="label">Curriculo</span>
                <div class="value">curriculum.pdf</div>
            </div>
            
            <a href="index.html"
            <button class="btn-logout">
                Fazer Logout 
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            </button>
            </a>
        </div>
    </div>

</body>
</html>
